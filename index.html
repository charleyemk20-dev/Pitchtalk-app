<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b6e3a">
<meta name="description" content="PitchTalk: predict matches, vote in fan polls, compare players and talk football with fans of your club.">
<title>PitchTalk</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PitchTalk">
<style>
:root{
  --green:#0b6e3a; --green-d:#064e2a; --green-l:#e3f3ea;
  --bg:#f3f8f4; --card:#ffffff; --ink:#0f1f16; --muted:#5b6b61; --line:#dce8e0;
  --gold:#f2b705; --bad:#c0392b; --bar:#cfe3d6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --green:#2fbf71; --green-d:#1d8f52; --green-l:#13261b;
    --bg:#0c1410; --card:#142019; --ink:#e8f3ec; --muted:#93a89b; --line:#23352a; --bar:#25402f;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header.top{background:var(--green);color:#fff;padding:14px 0 16px;position:sticky;top:0;z-index:5}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:800;font-size:1.25rem;letter-spacing:.2px}
.brand span{opacity:.85;font-weight:600}
.chip{background:rgba(255,255,255,.18);border-radius:999px;padding:6px 12px;font-size:.85rem;font-weight:600;white-space:nowrap}
h2{font-size:1.15rem;margin:20px 0 4px}
p.sub{margin:0 0 14px;color:var(--muted);font-size:.92rem;line-height:1.4}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.muted{color:var(--muted);font-size:.85rem}
.teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:10px 0}
.team{font-weight:700;font-size:.98rem;line-height:1.2}
.team.r{text-align:right}
.score{display:flex;align-items:center;gap:6px}
.score input{width:48px;height:44px;text-align:center;font-size:1.2rem;font-weight:700;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.score input:focus{outline:2px solid var(--green);border-color:var(--green)}
.score b{color:var(--muted)}
button,.btn{font:inherit;border:0;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer;background:var(--green);color:#fff}
button.ghost{background:var(--green-l);color:var(--green)}
button.small{padding:7px 12px;font-size:.85rem;border-radius:10px}
button:disabled{opacity:.5;cursor:not-allowed}
button.full{width:100%}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:.75rem;font-weight:700;background:var(--green-l);color:var(--green)}
.pill.gold{background:#fff4cc;color:#7a5a00}
.pill.grey{background:var(--bar);color:var(--muted)}
input[type=text],textarea,select{width:100%;font:inherit;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
textarea{resize:vertical;min-height:70px}
label{display:block;font-weight:700;font-size:.9rem;margin:14px 0 6px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:10}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
nav.tabs button{background:transparent;color:var(--muted);padding:6px 2px;font-size:.72rem;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:10px}
nav.tabs button .ic{font-size:1.25rem}
nav.tabs button.on{color:var(--green);background:var(--green-l)}
.opt{margin:8px 0}
.opt button{width:100%;text-align:left;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);position:relative;overflow:hidden;padding:12px}
.opt button .fill{position:absolute;inset:0 auto 0 0;background:var(--bar);z-index:0}
.opt button span{position:relative;z-index:1}
.opt button.mine{border-color:var(--green)}
.opt .pct{float:right;font-weight:800}
.stat{margin:12px 0}
.stat .lab{font-size:.8rem;color:var(--muted);text-align:center;margin-bottom:4px}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.bar{height:28px;border-radius:8px;background:var(--bar);position:relative;overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;background:var(--green);opacity:.35}
.bar.win i{opacity:1}
.bar.l i{right:0}.bar.r i{left:0}
.bar b{position:relative;z-index:1;line-height:28px;padding:0 10px;font-size:.88rem;display:block}
.bar.l b{text-align:left}.bar.r b{text-align:right}
.bar.win b{color:#fff}
.post{border-top:1px solid var(--line);padding:10px 0}
.post:first-child{border-top:0}
.post .who{font-weight:700;font-size:.9rem}
.post p{margin:4px 0 0;line-height:1.4;word-wrap:break-word}
table{width:100%;border-collapse:collapse}
td,th{padding:10px 6px;text-align:left;border-bottom:1px solid var(--line);font-size:.95rem}
th{color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.4px}
td.n,th.n{text-align:right}
tr.me td{background:var(--green-l);font-weight:800}
.hero{text-align:center;padding:36px 0 8px}
.hero .ball{font-size:3rem}
.hero h1{margin:6px 0;font-size:1.9rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));background:#111;color:#fff;padding:10px 16px;border-radius:999px;font-size:.9rem;z-index:20;max-width:90%;text-align:center}
.note{background:#fff4cc;color:#6b5000;border-radius:12px;padding:10px 12px;font-size:.82rem;line-height:1.4;margin:12px 0}
@media (prefers-color-scheme: dark){.note{background:#3a2f08;color:#f4dd8a}.pill.gold{background:#3a2f08;color:#f4dd8a}}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ---------- data ---------- */
const KEY = "pitchtalk_v1";
const CLUBS = ["Arsenal","Aston Villa","Bournemouth","Brentford","Brighton","Chelsea","Crystal Palace","Everton","Fulham","Liverpool","Manchester City","Manchester United","Newcastle","Nottingham Forest","Tottenham","West Ham","Wolves","Barcelona","Real Madrid","Other / neutral"];

// SAMPLE players: fictional names and made-up stats for demo purposes only.
// Replace with real data from a stats API when you are ready.
const PLAYERS = [
  {n:"Ayo Marlowe",   pos:"Forward",    goals:18, assists:6,  pass:78, tackles:12, mins:2650},
  {n:"Diego Santanna",pos:"Forward",    goals:15, assists:11, pass:82, tackles:20, mins:2890},
  {n:"Lars Mendel",   pos:"Midfielder", goals:7,  assists:14, pass:91, tackles:58, mins:3010},
  {n:"Kofi Brandt",   pos:"Midfielder", goals:5,  assists:9,  pass:88, tackles:74, mins:3200},
  {n:"Rui Valenca",   pos:"Defender",   goals:3,  assists:4,  pass:89, tackles:96, mins:3300},
  {n:"Sam Okoro",     pos:"Defender",   goals:2,  assists:6,  pass:84, tackles:88, mins:3150}
];
const STAT_ROWS = [["goals","Goals"],["assists","Assists"],["pass","Pass accuracy %"],["tackles","Tackles"],["mins","Minutes played"]];

const POLLS = [
  {id:"p1", q:"Best way to settle a derby?", o:["Early goal and park the bus","Attack from the first whistle","Win it late"], seed:[34,98,61]},
  {id:"p2", q:"Is VAR making football better?", o:["Yes, fairer","No, ruins the flow","Only if it's faster"], seed:[44,87,120]},
  {id:"p3", q:"Who deserves more credit: strikers or midfielders?", o:["Strikers","Midfielders","Defenders"], seed:[55,102,39]}
];

const DEMO_FANS = [
  {n:"Chidi_9ja",p:14},{n:"LagosGooner",p:12},{n:"KopKing_Abuja",p:11},{n:"Blue_Mikel",p:9},{n:"RedDevil_Ph",p:8},{n:"Spurs_Naija",p:6}
];

const BAD = ["fuck","shit","bitch","idiot","stupid","bastard"];

/* ---------- state ---------- */
function fresh(){return {user:null,club:null,preds:{},fixtures:[],votes:{},pollExtra:{},posts:[],tab:"predict",cmp:[0,1],hideInstall:false}}
function load(){try{const v=JSON.parse(localStorage.getItem(KEY));return v&&typeof v==="object"?Object.assign(fresh(),v):fresh()}catch(e){return fresh()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S = load();

/* ---------- helpers ---------- */
const $ = (s,e=document)=>e.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const DAY = 86400000;
function fmtKO(ts){
  const d=new Date(ts);
  return d.toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"})+" · "+d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"});
}
function toast(msg){
  const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);
  setTimeout(()=>t.remove(),2200);
}
function makeFixtures(club){
  const others = CLUBS.filter(c=>c!==club && c!=="Other / neutral");
  const pick = i => others[(i*3+club.length)%others.length];
  const base = Date.now();
  const list = [];
  const pairs = [];
  if(club!=="Other / neutral"){ pairs.push([club,pick(1)],[pick(2),club]); }
  pairs.push([pick(4),pick(5)],[pick(6),pick(7)],[pick(8),pick(9)],[pick(10),pick(11)]);
  pairs.forEach((p,i)=>list.push({id:"f"+i,h:p[0],a:p[1],ko:base+(i+1)*DAY*0.75+i*3600000,res:null}));
  return list;
}
function outcome(h,a){return h>a?"H":h<a?"A":"D"}
function pointsFor(pred,res){
  if(!pred||!res) return 0;
  if(pred.h===res.h && pred.a===res.a) return 3;
  return outcome(pred.h,pred.a)===outcome(res.h,res.a)?1:0;
}
function myPoints(){
  return S.fixtures.reduce((t,f)=>t+(f.res?pointsFor(S.preds[f.id],f.res):0),0);
}
function locked(f){return !!f.res || Date.now()>=f.ko}
function clean(txt){
  let out=txt;
  BAD.forEach(w=>{out=out.replace(new RegExp(w,"gi"),m=>"*".repeat(m.length))});
  return out;
}

/* ---------- views ---------- */
function viewOnboard(){
  return `<div class="wrap">
    <div class="hero"><div class="ball">⚽</div><h1>PitchTalk</h1>
    <p class="sub">Predict matches, vote in fan polls, compare players and talk football with fans of your club.</p></div>
    <div class="card">
      <label for="nick">Your fan name</label>
      <input id="nick" type="text" maxlength="20" placeholder="e.g. NaijaGooner" autocomplete="off">
      <label for="club">Your club</label>
      <select id="club">${CLUBS.map(c=>`<option>${esc(c)}</option>`).join("")}</select>
      <p class="muted" style="margin:12px 0 0">No sign-up needed for this early version. Your picks are saved on this phone.</p>
      <div style="margin-top:14px"><button class="full" data-act="start">Start playing</button></div>
    </div></div>`;
}

/* ---------- install helpers ---------- */
let deferredPrompt = null;
const isStandalone = () => (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent);
function installCard(){
  if(isStandalone() || S.hideInstall) return "";
  if(deferredPrompt){
    return `<div class="card" style="margin-top:14px"><b>Install PitchTalk</b>
      <p class="muted" style="margin:4px 0 10px">Add the app to your home screen. It opens full screen, like any other app.</p>
      <div class="row"><button class="small" data-act="install">Install app</button><button class="ghost small" data-act="dismissinstall">Not now</button></div></div>`;
  }
  if(isIOS()){
    return `<div class="card" style="margin-top:14px"><b>Install PitchTalk</b>
      <p class="muted" style="margin:4px 0 10px">In Safari, tap the Share button, then <b>Add to Home Screen</b>.</p>
      <button class="ghost small" data-act="dismissinstall">Got it</button></div>`;
  }
  return "";
}

function viewPredict(){
  const mine = S.fixtures.filter(f=>f.h===S.club||f.a===S.club);
  const rest = S.fixtures.filter(f=>!(f.h===S.club||f.a===S.club));
  const card = f=>{
    const p=S.preds[f.id]; const lk=locked(f);
    let foot="";
    if(f.res){
      const pts=pointsFor(p,f.res);
      foot=`<div class="row between"><span class="muted">Final: ${f.res.h} – ${f.res.a}</span><span class="pill ${pts?"":"grey"}">${p?`You: ${p.h}–${p.a} · +${pts} pt${pts===1?"":"s"}`:"No prediction"}</span></div>`;
    }else if(lk){
      foot=`<div class="muted">Kick-off passed. ${p?`Your pick: ${p.h}–${p.a}`:"No prediction made."}</div>`;
    }else{
      foot=`<div class="row between"><span class="muted">${p?"Saved. You can change it until kick-off.":"Enter your score prediction"}</span><button class="small" data-act="savepred" data-id="${f.id}">${p?"Update":"Lock in"}</button></div>`;
    }
    return `<div class="card">
      <div class="row between"><span class="muted">${fmtKO(f.ko)}</span>${f.h===S.club||f.a===S.club?'<span class="pill gold">Your club</span>':""}</div>
      <div class="teams">
        <div class="team">${esc(f.h)}</div>
        <div class="score"><input inputmode="numeric" pattern="[0-9]*" maxlength="2" id="h_${f.id}" value="${p?p.h:""}" ${lk?"disabled":""} aria-label="${esc(f.h)} goals"><b>:</b><input inputmode="numeric" pattern="[0-9]*" maxlength="2" id="a_${f.id}" value="${p?p.a:""}" ${lk?"disabled":""} aria-label="${esc(f.a)} goals"></div>
        <div class="team r">${esc(f.a)}</div>
      </div>${foot}</div>`;
  };
  return `<div class="wrap">
    ${installCard()}
    <h2>Predict the score</h2>
    <p class="sub">Exact score = 3 points. Right result (win/draw/lose) = 1 point.</p>
    <div class="note">Demo fixtures: these matches are samples so you can try the app. Real fixtures come when a football data feed is connected.</div>
    ${mine.map(card).join("")}${rest.map(card).join("")}
  </div>`;
}

function pollCounts(p){
  const extra=S.pollExtra[p.id]||[];
  return p.seed.map((n,i)=>n+(extra[i]||0));
}
function viewPolls(){
  return `<div class="wrap"><h2>Fan polls</h2><p class="sub">Vote once per poll and see what other fans think.</p>
  ${POLLS.map(p=>{
    const c=pollCounts(p), tot=c.reduce((a,b)=>a+b,0), v=S.votes[p.id];
    return `<div class="card"><b>${esc(p.q)}</b>
      ${p.o.map((o,i)=>{
        const pct=Math.round(c[i]/tot*100);
        return v===undefined
          ? `<div class="opt"><button data-act="vote" data-p="${p.id}" data-i="${i}"><span>${esc(o)}</span></button></div>`
          : `<div class="opt"><button class="${v===i?"mine":""}" disabled style="opacity:1"><i class="fill" style="width:${pct}%"></i><span>${esc(o)}${v===i?" ✓":""}<span class="pct">${pct}%</span></span></button></div>`;
      }).join("")}
      <div class="muted">${tot} votes</div></div>`;
  }).join("")}
  </div>`;
}

function viewCompare(){
  const [a,b]=S.cmp; const A=PLAYERS[a], B=PLAYERS[b];
  const opts=i=>PLAYERS.map((p,k)=>`<option value="${k}" ${k===i?"selected":""}>${esc(p.n)}</option>`).join("");
  const rows=STAT_ROWS.map(([k,label])=>{
    const max=Math.max(A[k],B[k])||1;
    const wa=A[k]>B[k], wb=B[k]>A[k];
    return `<div class="stat"><div class="lab">${label}</div><div class="bars">
      <div class="bar l ${wa?"win":""}"><i style="width:${A[k]/max*100}%"></i><b>${A[k]}</b></div>
      <div class="bar r ${wb?"win":""}"><i style="width:${B[k]/max*100}%"></i><b>${B[k]}</b></div></div></div>`;
  }).join("");
  return `<div class="wrap"><h2>Compare players</h2><p class="sub">Pick two players and see who comes out on top.</p>
    <div class="note">Sample data: these players and numbers are made up for the demo.</div>
    <div class="card">
      <div class="bars" style="gap:8px">
        <div><select id="cmpA">${opts(a)}</select><div class="muted" style="margin-top:4px">${esc(A.pos)}</div></div>
        <div><select id="cmpB">${opts(b)}</select><div class="muted" style="margin-top:4px">${esc(B.pos)}</div></div>
      </div>
      ${rows}
      <div style="margin-top:8px"><button class="ghost full" data-act="sharecmp">Share this comparison</button></div>
    </div></div>`;
}

function viewClub(){
  const posts=S.posts.filter(p=>p.club===S.club&&!p.hidden);
  const seed = [
    {id:"s1",who:"Matchday_Mo",txt:"Who starts up front this weekend? I say go attacking.",t:Date.now()-3*3600000},
    {id:"s2",who:"Terrace_Talk",txt:"That last result was tough, but the second half showed fight.",t:Date.now()-26*3600000}
  ];
  const all=posts.concat(seed.filter(s=>!(S.hiddenSeeds||[]).includes(s.id))).sort((x,y)=>y.t-x.t);
  return `<div class="wrap"><h2>${esc(S.club)} fans</h2><p class="sub">Keep it friendly. Be respectful to other fans.</p>
    <div class="card">
      <textarea id="newpost" maxlength="280" placeholder="Share your thoughts on the club…"></textarea>
      <div class="row between" style="margin-top:8px"><span class="muted" id="cnt">0 / 280</span><button class="small" data-act="post">Post</button></div>
    </div>
    <div class="card">${all.map(p=>`<div class="post"><div class="row between"><span class="who">${esc(p.who)}</span>
      <span class="muted">${new Date(p.t).toLocaleDateString(undefined,{day:"numeric",month:"short"})}</span></div>
      <p>${esc(p.txt)}</p>
      <button class="ghost small" style="margin-top:6px" data-act="report" data-id="${p.id}">Report</button></div>`).join("")||'<p class="muted">No posts yet. Be the first.</p>'}</div>
  </div>`;
}

function viewBoard(){
  const me={n:S.user+" (you)",p:myPoints(),me:true};
  const rows=DEMO_FANS.concat([me]).sort((a,b)=>b.p-a.p);
  return `<div class="wrap"><h2>Leaderboard</h2><p class="sub">Points from your predictions, ranked against other fans.</p>
    <div class="note">Demo leaderboard: the other fans are samples. A live leaderboard needs the online database to be connected.</div>
    <div class="card"><table><thead><tr><th>#</th><th>Fan</th><th class="n">Pts</th></tr></thead><tbody>
    ${rows.map((r,i)=>`<tr class="${r.me?"me":""}"><td>${i+1}</td><td>${esc(r.n)}</td><td class="n">${r.p}</td></tr>`).join("")}
    </tbody></table></div>
    <div class="card"><b>Try it out</b><p class="muted" style="margin:6px 0 10px">Simulate the final whistle on all open matches to see how your points are scored.</p>
    <button class="ghost full" data-act="simulate">Simulate matchday results</button>
    <div style="height:8px"></div>
    <button class="ghost full" data-act="reset">Reset everything</button></div>
  </div>`;
}

const TABS=[["predict","🎯","Predict"],["polls","🗳️","Polls"],["compare","⚖️","Compare"],["club","💬","Club"],["board","🏆","Board"]];
function render(){
  const app=$("#app");
  if(!S.user){app.innerHTML=viewOnboard();return}
  const views={predict:viewPredict,polls:viewPolls,compare:viewCompare,club:viewClub,board:viewBoard};
  app.innerHTML=`<header class="top"><div class="wrap"><div class="brand">⚽ Pitch<span>Talk</span></div><div class="chip">${esc(S.user)} · ${myPoints()} pts</div></div></header>
    ${(views[S.tab]||viewPredict)()}
    <nav class="tabs"><div class="in">${TABS.map(t=>`<button class="${S.tab===t[0]?"on":""}" data-act="tab" data-t="${t[0]}"><span class="ic">${t[1]}</span>${t[2]}</button>`).join("")}</div></nav>`;
  const np=$("#newpost"); if(np) np.addEventListener("input",()=>{$("#cnt").textContent=np.value.length+" / 280"});
  const ca=$("#cmpA"), cb=$("#cmpB");
  if(ca) ca.addEventListener("change",()=>{S.cmp[0]=+ca.value;save();render()});
  if(cb) cb.addEventListener("change",()=>{S.cmp[1]=+cb.value;save();render()});
}

/* ---------- actions ---------- */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const act=el.dataset.act;
  if(act==="start"){
    const name=$("#nick").value.trim().replace(/\s+/g," ");
    if(name.length<2){toast("Enter a fan name (at least 2 letters)");return}
    S.user=clean(name); S.club=$("#club").value; S.fixtures=makeFixtures(S.club); S.tab="predict";
    save();render();window.scrollTo(0,0);
  }else if(act==="tab"){
    S.tab=el.dataset.t;save();render();window.scrollTo(0,0);
  }else if(act==="savepred"){
    const id=el.dataset.id, f=S.fixtures.find(x=>x.id===id);
    if(!f||locked(f)){toast("Predictions are closed for this match");return}
    const h=$("#h_"+id).value.trim(), a=$("#a_"+id).value.trim();
    if(!/^\d{1,2}$/.test(h)||!/^\d{1,2}$/.test(a)){toast("Enter both scores (0–99)");return}
    S.preds[id]={h:+h,a:+a};save();toast("Prediction saved ✓");render();
  }else if(act==="vote"){
    const p=el.dataset.p,i=+el.dataset.i;
    if(S.votes[p]!==undefined) return;
    S.votes[p]=i;(S.pollExtra[p]=S.pollExtra[p]||[])[i]=((S.pollExtra[p]||[])[i]||0)+1;
    save();render();
  }else if(act==="sharecmp"){
    const [a,b]=S.cmp,A=PLAYERS[a],B=PLAYERS[b];
    const txt=`${A.n} vs ${B.n} on PitchTalk: goals ${A.goals}-${B.goals}, assists ${A.assists}-${B.assists}, tackles ${A.tackles}-${B.tackles}. Who's better?`;
    if(navigator.share){navigator.share({text:txt}).catch(()=>{})}
    else if(navigator.clipboard){navigator.clipboard.writeText(txt).then(()=>toast("Copied to clipboard"),()=>toast("Could not copy"))}
  }else if(act==="post"){
    const v=$("#newpost").value.trim();
    if(v.length<2){toast("Write something first");return}
    S.posts.push({id:"u"+Date.now(),club:S.club,who:S.user,txt:clean(v),t:Date.now()});
    save();toast("Posted ✓");render();
  }else if(act==="report"){
    const id=el.dataset.id;
    const u=S.posts.find(p=>p.id===id);
    if(u) u.hidden=true; else (S.hiddenSeeds=S.hiddenSeeds||[]).push(id);
    save();toast("Reported. Thanks for keeping it clean.");render();
  }else if(act==="simulate"){
    let n=0;
    S.fixtures.forEach(f=>{if(!f.res){f.res={h:Math.floor(Math.random()*4),a:Math.floor(Math.random()*4)};n++}});
    save();toast(n?"Results are in! Check your points":"All matches are already finished");render();
  }else if(act==="install"){
    if(!deferredPrompt) return;
    const dp=deferredPrompt; deferredPrompt=null;
    dp.prompt();
    dp.userChoice.then(c=>{toast(c.outcome==="accepted"?"Installing PitchTalk…":"No problem, you can install later");render()}).catch(()=>render());
  }else if(act==="dismissinstall"){
    S.hideInstall=true;save();render();
  }else if(act==="reset"){
    if(confirm("Reset all your data on this phone?")){localStorage.removeItem(KEY);S=fresh();render()}
  }
});
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;if(S.user&&S.tab==="predict")render()});
window.addEventListener("appinstalled",()=>{deferredPrompt=null;toast("PitchTalk installed ✓");render()});
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})});
}
render();
</script>
